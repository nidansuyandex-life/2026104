<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>日常 Daily</title>
<script src="./data/decks.js"></script>
<script src="./data/valve.js"></script>
<script src="./data/words.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#111827;--sub:#6b7280;--brand:#4f46e5;--brand2:#7c3aed;--ok:#059669;--warn:#b45309;--err:#dc2626;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#e9ebf3;color:var(--ink);display:flex;justify-content:center;min-height:100dvh;overflow:hidden;}
.phone{position:relative;width:100%;max-width:460px;height:100dvh;background:linear-gradient(180deg,#fbfbfe,#f3f4fa);display:flex;flex-direction:column;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 0 0 4px rgba(79,70,229,.12);}
.today{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;}
.top-icon-btn{border:0;background:#fff;width:34px;height:34px;border-radius:11px;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:0 1px 2px rgba(16,24,40,.06);}
.top-icon-btn:active{transform:scale(.94);}
#view{flex:1;overflow-y:auto;padding:2px 16px 90px;-webkit-overflow-scrolling:touch;}
#view::-webkit-scrollbar{width:0;}
.tabbar{flex-shrink:0;display:flex;background:rgba(255,255,255,.95);border-top:1px solid rgba(0,0,0,.06);padding:8px 2px calc(8px + env(safe-area-inset-bottom));}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;border-radius:12px;cursor:pointer;color:#9aa0b0;font-size:9.5px;font-family:inherit;font-weight:600;}
.tab.on{color:var(--brand);}
.tab-icon{font-size:16px;line-height:1;}
.tab.on .tab-icon{transform:translateY(-1px) scale(1.12);}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid rgba(16,24,40,.045);box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 22px -14px rgba(16,24,40,.28);}
.card.done{background:#f8f9fd;border-style:dashed;opacity:.72;}
.hero{padding:4px 4px 14px;}
.hero-k{font-size:12px;color:var(--brand);font-weight:700;letter-spacing:.5px;margin-bottom:7px;}
.hero h1{font-size:22px;margin:0;letter-spacing:-.5px;line-height:1.25;}
.sec-title{font-size:13px;font-weight:700;color:#3b4256;margin:18px 4px 10px;display:flex;justify-content:space-between;align-items:baseline;}
.sec-title .muted{font-weight:500;font-size:11.5px;}
.muted{color:var(--sub);}
.foot-note{text-align:center;font-size:11.5px;color:#aab0c0;padding:18px 0 4px;}
.btn{border:0;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:650;cursor:pointer;font-family:inherit;transition:transform .15s,background .2s;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 8px 20px -10px rgba(79,70,229,.9);}
.btn.wide{width:100%;margin-top:6px;}
.btn.ghost{background:#f1f2f9;color:#4b5265;padding:8px 14px;font-size:13px;}
.btn.danger{background:#fef2f2;color:#dc2626;padding:8px 14px;font-size:13px;}
.sk{background:linear-gradient(90deg,#eef0f7 25%,#f7f8fc 37%,#eef0f7 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:18px;margin-bottom:12px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px -16px;padding:6px 16px 12px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{border:1px solid #e6e8f0;background:#fff;color:#5b6276;padding:8px 15px;border-radius:99px;font-size:13.5px;font-weight:650;white-space:nowrap;cursor:pointer;font-family:inherit;flex-shrink:0;}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.tip-card{background:#fff;border:1px dashed #dfe2ee;border-radius:16px;padding:14px;font-size:12.5px;line-height:1.7;color:#5b6276;margin-top:4px;}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e6e8f0;border-radius:14px;padding:10px 14px;margin:8px 0 4px;}
.search-input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:14px;color:var(--ink);padding:2px 0;}
.search-clear{border:0;background:#f1f2f9;color:#6b7280;width:24px;height:24px;border-radius:50%;font-size:12px;cursor:pointer;display:grid;place-items:center;font-family:inherit;}
.know-cat{display:inline-block;font-size:11px;font-weight:700;color:var(--brand);background:#eef0ff;padding:3px 9px;border-radius:6px;margin-bottom:10px;}
.know-q{font-size:15.5px;font-weight:750;line-height:1.5;letter-spacing:-.25px;}
.know-a{font-size:13.5px;line-height:1.78;color:#3f4658;margin-top:12px;padding-top:12px;border-top:1px dashed #eceef4;}
.know-key{margin-top:12px;background:#f8f9fd;border-left:3px solid var(--brand);padding:11px 13px;border-radius:0 10px 10px 0;font-size:12.5px;line-height:1.75;color:#4b5265;}
.know-body{display:none;margin-top:12px;}
.know.open .know-body{display:block;}
.qa-block{margin-top:14px;padding-top:14px;border-top:1px dashed #eceef4;}
.qa-label{font-size:12px;color:var(--brand);margin-bottom:8px;font-weight:700;}
.qa-input{width:100%;min-height:60px;border:1px solid #e6e8f0;border-radius:12px;padding:11px 12px;font-family:inherit;font-size:13.5px;line-height:1.65;resize:vertical;color:var(--ink);background:#fafbfe;}
.qa-row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;}
.qa-btn{background:var(--brand);color:#fff;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:650;border:0;cursor:pointer;font-family:inherit;}
.qa-btn:disabled{opacity:.5;}
.qa-btn.ghost{background:#f1f2f9;color:#4b5265;}
.qa-answer{margin-top:12px;background:linear-gradient(135deg,#eef0ff,#f6f0ff);border:1px solid #e2e5ff;border-radius:12px;padding:13px;}
.qa-answer-head{font-size:11.5px;font-weight:750;color:var(--brand);margin-bottom:9px;}
.qa-answer-body{font-size:13px;line-height:1.78;color:#3f4658;white-space:pre-wrap;}
.note-block{margin-top:14px;padding-top:14px;border-top:1px dashed #eceef4;}
.note-label{font-size:12px;color:var(--sub);margin-bottom:8px;font-weight:700;}
.note-input{width:100%;min-height:70px;border:1px solid #e6e8f0;border-radius:12px;padding:11px 12px;font-family:inherit;font-size:13.5px;line-height:1.65;resize:vertical;color:var(--ink);background:#fafbfe;}
.subtabs{display:flex;gap:5px;background:#fff;border-radius:14px;padding:5px;margin-bottom:12px;border:1px solid rgba(16,24,40,.05);overflow-x:auto;scrollbar-width:none;}
.subtabs::-webkit-scrollbar{display:none;}
.subtab{border:0;background:none;padding:9px 12px;border-radius:10px;font-family:inherit;font-size:12.5px;font-weight:650;color:#7a8194;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.subtab.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;}
.rate-row{display:flex;gap:8px;margin-top:14px;}
.rate-btn{flex:1;border:0;padding:12px 4px;border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
.rate-btn.again{background:#fef2f2;color:#dc2626;}
.rate-btn.hard{background:#fef3c7;color:#b45309;}
.rate-btn.good{background:#ecfdf5;color:#047857;}
.score-card{background:#fff;border:1px solid #e2e5ff;border-radius:16px;padding:16px;margin-top:14px;}
.score-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.score-num{font-size:34px;font-weight:850;color:var(--brand);letter-spacing:-1.5px;line-height:1;}
.score-label{font-size:12px;font-weight:700;color:var(--brand);}
.score-row{margin-top:12px;padding-top:12px;border-top:1px dashed #eceef4;}
.score-row-title{font-size:12px;font-weight:750;margin-bottom:8px;}
.score-list{margin:0;padding-left:18px;}
.score-list li{font-size:13px;line-height:1.75;color:#3f4658;margin-bottom:4px;}
.score-extra{background:#f8f9fd;border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.78;color:#4b5265;}
.answer-input{width:100%;min-height:110px;border:1px solid #e6e8f0;border-radius:12px;padding:12px;font-family:inherit;font-size:14px;line-height:1.7;resize:vertical;color:var(--ink);background:#fafbfe;margin-top:6px;}
.word-big{font-size:32px;font-weight:850;letter-spacing:-.8px;line-height:1.1;color:#2b3244;}
.word-ph{font-size:13px;color:var(--sub);margin-top:6px;}
.ai-msg{padding:12px 14px;border-radius:14px;margin-bottom:10px;font-size:13.5px;line-height:1.75;}
.ai-msg.user{background:var(--brand);color:#fff;margin-left:32px;white-space:pre-wrap;}
.ai-msg.bot{background:#f8f9fd;color:#2b3244;margin-right:32px;white-space:pre-wrap;}
.rec-btn{flex:1;min-width:100px;padding:10px 14px;border-radius:10px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;text-align:center;border:0;}
.rec-btn.app{background:var(--brand);color:#fff;}
.rec-btn.web{background:#f1f2f9;color:#4b5265;}
.streak-badge{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;font-size:10.5px;font-weight:750;padding:2px 7px;border-radius:99px;}
.fab{position:absolute;right:16px;bottom:78px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;font-size:24px;cursor:pointer;box-shadow:0 10px 24px -8px rgba(79,70,229,.7);z-index:50;font-family:inherit;display:grid;place-items:center;}
.fab:active{transform:scale(.92);}
#sheet{position:absolute;inset:0;z-index:60;pointer-events:none;}
#sheet.open{pointer-events:auto;}
.sheet-mask{position:absolute;inset:0;background:rgba(15,20,40,.4);opacity:0;transition:opacity .28s;}
#sheet.open .sheet-mask{opacity:1;}
.sheet-body{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);max-height:88%;overflow-y:auto;}
#sheet.open .sheet-body{transform:translateY(0);}
.sheet-body::-webkit-scrollbar{width:0;}
.sheet-head{display:flex;gap:14px;align-items:center;margin-bottom:6px;}
.sheet-emoji{font-size:38px;line-height:1;}
.sheet-head h2{font-size:19px;margin:0 0 4px;}
.sheet-sec{margin-top:20px;}
.toast{position:absolute;left:50%;bottom:150px;transform:translate(-50%,10px);background:rgba(17,24,39,.92);color:#fff;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:14px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.task-card{background:linear-gradient(135deg,#fff,#f8f9fd);border:1px solid rgba(79,70,229,.12);border-radius:18px;padding:16px;margin-bottom:14px;}
.task-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.task-title{font-size:14px;font-weight:750;}
.task-progress{font-size:12px;color:var(--sub);font-weight:600;}
.task-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #eceef4;cursor:pointer;}
.task-row:last-child{border:0;padding-bottom:0;}
.task-check{width:22px;height:22px;border-radius:8px;border:2px solid #dfe2ee;background:#fff;display:grid;place-items:center;font-size:12px;flex-shrink:0;color:#fff;font-weight:700;}
.task-check.on{background:var(--brand);border-color:var(--brand);}
.task-label{flex:1;font-size:13px;font-weight:600;color:#3f4658;}
.task-label.on{color:#aab0c0;text-decoration:line-through;}
.task-count{font-size:11.5px;color:var(--sub);font-weight:600;}
.weekly-card{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px;}
.weekly-card .tag{font-size:11px;font-weight:750;letter-spacing:1.5px;opacity:.75;margin-bottom:8px;}
.weekly-card h3{font-size:17px;margin:0 0 8px;}
.weekly-card p{font-size:13px;line-height:1.7;opacity:.92;margin:0 0 14px;}
.weekly-score{font-size:36px;font-weight:850;line-height:1;}
.global-search-bar{display:flex;gap:8px;align-items:center;background:#f8f9fd;border-radius:12px;padding:10px 14px;margin-bottom:14px;}
.global-search-bar input{flex:1;border:0;background:transparent;font-family:inherit;font-size:15px;outline:0;color:var(--ink);}
.search-result{padding:12px 4px;border-bottom:1px solid #f0f1f6;cursor:pointer;}
.search-result-type{display:inline-block;font-size:10.5px;font-weight:750;padding:2px 7px;border-radius:5px;margin-bottom:6px;}
.type-valve{background:#eef0ff;color:var(--brand);}
.type-word{background:#ecfdf5;color:#047857;}
.search-result-q{font-size:14px;font-weight:650;line-height:1.5;margin-bottom:4px;}
.search-result-snippet{font-size:12.5px;color:var(--sub);line-height:1.6;}
.accent-row{display:flex;gap:6px;margin-top:8px;}
.accent-btn{flex:1;border:1px solid #e6e8f0;background:#fff;border-radius:10px;padding:8px;font-family:inherit;font-size:12.5px;font-weight:650;cursor:pointer;color:#5b6276;}
.accent-btn.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.link-btn{background:none;border:0;color:var(--brand);font-size:12px;font-weight:650;cursor:pointer;font-family:inherit;padding:4px 8px;border-radius:6px;}
.ai-role-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.ai-role-btn{border:1px solid #e6e8f0;background:#fff;border-radius:99px;padding:5px 11px;font-family:inherit;font-size:11.5px;font-weight:650;cursor:pointer;color:#5b6276;}
.ai-role-btn.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.hobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px;}
.hobby-card{background:#fff;border:1px solid rgba(16,24,40,.05);border-radius:18px;padding:16px 14px;text-align:left;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:7px;}
.hobby-card .emoji{font-size:26px;line-height:1;}
.hobby-card .h-name{font-size:14.5px;font-weight:700;color:var(--ink);}
.hobby-card .h-cost{font-size:11.5px;color:var(--sub);}
.status-badge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:750;flex-shrink:0;}
.status-badge.ok{background:#ecfdf5;color:#047857;}
.status-badge.warn{background:#fef3c7;color:#b45309;}
.step-list{margin:0;padding-left:20px;}
.step-list li{font-size:13.5px;line-height:1.85;color:#3f4658;}
.deck-chip{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:#fff;border:1px solid #e6e8f0;border-radius:14px;padding:11px 14px;cursor:pointer;font-family:inherit;flex-shrink:0;min-width:130px;text-align:left;}
.deck-chip.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;}
.deck-chip .dc-name{font-size:13.5px;font-weight:750;}
.deck-chip .dc-meta{font-size:11px;opacity:.7;}
.progress-bar{height:8px;background:#e5e7f5;border-radius:99px;overflow:hidden;margin-top:10px;}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .4s;}
.load-more{border:0;background:#f1f2f9;color:#4b5265;width:100%;padding:13px;border-radius:12px;font-family:inherit;font-size:13px;font-weight:650;cursor:pointer;margin-top:6px;}
.word-mini{background:#fff;border:1px solid rgba(16,24,40,.06);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:8px;}
.word-mini.done{background:#f8f9fd;opacity:.65;border-style:dashed;}
.word-mini .wm-word{font-size:15px;font-weight:750;color:#2b3244;flex-shrink:0;}
.word-mini.done .wm-word{text-decoration:line-through;color:#aab0c0;}
.word-mini .wm-cn{font-size:12px;color:var(--sub);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.word-mini.done .wm-cn{text-decoration:line-through;}
.word-mini .wm-check{width:22px;height:22px;border-radius:50%;border:2px solid #dfe2ee;background:#fff;display:grid;place-items:center;font-size:11px;flex-shrink:0;color:#fff;font-weight:700;}
.word-mini .wm-check.on{background:var(--brand);border-color:var(--brand);}
.loading-card{background:#fff;border-radius:18px;padding:32px 20px;text-align:center;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
.news-source{flex:1;min-width:100px;padding:10px 12px;border-radius:10px;font-size:12.5px;font-weight:650;font-family:inherit;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.review-entry{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;border-radius:18px;padding:14px;margin-bottom:14px;}
.review-entry .r-title{font-size:13.5px;font-weight:750;color:#92400e;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;}
.review-entry .r-meta{font-size:12px;color:#a16207;line-height:1.7;margin-bottom:10px;}
.src-badge{display:inline-block;font-size:10.5px;font-weight:750;padding:2px 8px;border-radius:5px;margin-bottom:8px;}
.src-badge.wiki{background:#eef0ff;color:var(--brand);}
.src-badge.showapi{background:#fef3c7;color:#b45309;}
.src-badge.oioweb{background:#ecfdf5;color:#047857;}
.src-badge.hitokoto{background:#fef3c7;color:#b45309;}
.src-badge.vvhan{background:#fee2e2;color:#dc2626;}
.src-badge.itunes{background:#dbeafe;color:#1d4ed8;}
.src-badge.tmdb{background:#dbeafe;color:#1d4ed8;}
.src-badge.openlib{background:#fef3c7;color:#92400e;}
.src-badge.gutendex{background:#ecfdf5;color:#047857;}
.quote-card{background:linear-gradient(135deg,#fce7f3,#f3e8ff);border:1px solid #f0abfc;border-radius:14px;padding:14px;margin-top:10px;}
.quote-card .q-text{font-size:14.5px;line-height:1.85;color:#3b0764;font-weight:600;font-style:italic;}
.quote-card .q-cn{font-size:12.5px;line-height:1.7;color:#6b21a8;margin-top:8px;padding-top:8px;border-top:1px dashed #f0abfc;}
.quote-card .q-author{font-size:12px;color:#6b21a8;margin-top:8px;text-align:right;}
.quote-card .q-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.story-card{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1px solid #6ee7b7;border-radius:14px;padding:14px;margin-top:10px;}
.story-card .s-title{font-size:14.5px;font-weight:750;color:#065f46;line-height:1.5;}
.story-card .s-author{font-size:12px;color:#047857;margin-top:4px;}
.story-card .s-preview{font-size:13px;line-height:1.75;color:#064e3b;margin-top:10px;}
.story-card .s-cn{font-size:12.5px;line-height:1.7;color:#047857;margin-top:10px;padding-top:10px;border-top:1px dashed #6ee7b7;}
.story-card .s-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.joke-card{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;border-radius:14px;padding:14px;margin-top:10px;}
.joke-card .j-text{font-size:13.5px;line-height:1.85;color:#78350f;white-space:pre-wrap;}
.joke-card .j-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.err-inline{background:#fef3c7;border:1px solid #fde68a;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.7;color:#92400e;margin-top:8px;}
.ex-btn{border:0;background:#eef0ff;color:var(--brand);padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:650;cursor:pointer;font-family:inherit;}
.ex-cn{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.65;}
.src-tag{display:inline-block;font-size:10.5px;font-weight:750;padding:2px 8px;border-radius:5px;margin-bottom:8px;background:#eef0ff;color:var(--brand);}
</style>
</head>

function dailyPick(arr,n,salt=0){
  if(!arr||!arr.length) return [];
  let seed=(DAY*1000+salt*7919)%2147483647;
  if(seed<=0) seed+=2147483646;
  const rnd=()=>{seed=(seed*16807)%2147483647; return (seed-1)/2147483646;};
  const idx=arr.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]];}
  return idx.slice(0,n).map(i=>arr[i]);
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* ★★★ 关键修复：用 XMLHttpRequest 替代 fetch（Android WebView 兼容更好） ★★★ */
function httpGet(url, timeout){
  timeout = timeout || API_TIMEOUT;
  return new Promise((resolve, reject) => {
    let done = false;
    const xhr = new XMLHttpRequest();
    try {
      xhr.open('GET', url, true);
      xhr.timeout = timeout;
      xhr.setRequestHeader('Accept', 'application/json, text/plain, */*');
      xhr.onreadystatechange = () => {
        if (xhr.readyState === 4 && !done){
          done = true;
          if (xhr.status >= 200 && xhr.status < 300){
            resolve(xhr.responseText);
          } else {
            reject(new Error('HTTP ' + xhr.status));
          }
        }
      };
      xhr.onerror = () => { if (!done){ done = true; reject(new Error('网络错误（可能 CORS 或网络不可达）')); } };
      xhr.ontimeout = () => { if (!done){ done = true; reject(new Error('请求超时')); } };
      xhr.send();
    } catch(e){
      if (!done){ done = true; reject(e); }
    }
  });
}
async function apiGet(url, timeout){
  const text = await httpGet(url, timeout);
  try { return JSON.parse(text); } catch(e){ return text; }
}

const DeckLoader = {
  loaded:{}, loading:{},
  load(deckId){
    if (this.loaded[deckId]) return Promise.resolve(this.loaded[deckId]);
    if (this.loading[deckId]) return this.loading[deckId];
    if (window.__WORD_DECK_DATA && window.__WORD_DECK_DATA[deckId]){
      const words = window.__WORD_DECK_DATA[deckId].map(w => ({ ...w, deck: deckId }));
      this.loaded[deckId] = words;
      return Promise.resolve(words);
    }
    const meta = SEED.DECKS.find(d => d.id === deckId);
    if (!meta || !meta.file){ this.loaded[deckId] = []; return Promise.resolve([]); }
    this.loading[deckId] = new Promise(resolve => {
      const s = document.createElement('script');
      s.src = meta.file;
      s.onload = () => {
        const raw = (window.__WORD_DECK_DATA && window.__WORD_DECK_DATA[deckId]) || [];
        const words = raw.map(w => ({ ...w, deck: deckId }));
        this.loaded[deckId] = words;
        resolve(words);
      };
      s.onerror = () => { this.loaded[deckId] = []; resolve([]); };
      document.head.appendChild(s);
    });
    return this.loading[deckId];
  },
  allLoaded(){ return !SEED.DECKS.length || SEED.DECKS.every(d => this.loaded[d.id] !== undefined); },
  get(deckId){
    if (deckId === 'all'){
      const all = [];
      SEED.DECKS.forEach(d => { const w = this.loaded[d.id]; if (Array.isArray(w)) all.push(...w); });
      return all;
    }
    return this.loaded[deckId] || [];
  },
  findWord(wordStr){
    const map = LS.get('word-deck-map', {});
    const deckId = map[wordStr];
    if (deckId && this.loaded[deckId]){
      const found = this.loaded[deckId].find(w => w.w === wordStr);
      if (found) return found;
    }
    for (const id in this.loaded){
      const found = (this.loaded[id] || []).find(w => w.w === wordStr);
      if (found) return found;
    }
    return null;
  },
  async ensureForReview(){
    const map = LS.get('word-deck-map', {});
    const ids = new Set(Object.values(map));
    if (!ids.size){ for (const d of SEED.DECKS) await this.load(d.id).catch(()=>[]); return; }
    await Promise.all([...ids].map(id => this.load(id).catch(() => [])));
  }
};

  getStreak(){
    const d = LS.get('streak', null);
    if (!d || typeof d !== 'object') return { count:0, last:null, best:0 };
    return { count: d.count||0, last: d.last||null, best: d.best||d.count||0 };
  },
  checkIn(){
    const t = todayStr();
    const y = new Date(Date.now()-86400000);
    const yStr = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    const d = this.getStreak();
    if (d.last === t) return d;
    const newCount = d.last === yStr ? d.count+1 : 1;
    const best = Math.max(d.best, newCount);
    const next = { count:newCount, last:t, best };
    LS.set('streak', next);
    return next;
  },
  getSchedule(type){ const v = LS.get('schedule:'+type, {}); return (v && typeof v === 'object') ? v : {}; },
  setSchedule(type, obj){ LS.set('schedule:'+type, obj); },

    if (!s[key]){ s[key] = { stage:0, nextDay:DAY, wrongCount:0, rightCount:0 }; this.setSchedule(type, s); }

  },
  getReviewList(type, limit){
    limit = limit || REVIEW_TARGET;
    const s = this.getSchedule(type);
    const all = Object.keys(s);
    if (!all.length) return [];
    return shuffle(all).slice(0, limit);
  },
  rateItem(type, key, rating){
    const s = this.getSchedule(type);
    const cur = s[key] || { stage:0, nextDay:DAY, wrongCount:0, rightCount:0 };
    const isEn = type === 'english';
    let nextDay;
    if (rating === 'again'){ nextDay = DAY + (isEn?1:3); cur.wrongCount = (cur.wrongCount||0)+1; cur.stage = 0; }
    else if (rating === 'hard'){ nextDay = DAY + (isEn?2:3); cur.stage = Math.max(1, cur.stage||0); }
    else { nextDay = DAY + (isEn?5:7); cur.stage = Math.min(5, (cur.stage||0)+1); cur.rightCount = (cur.rightCount||0)+1; cur.wrongCount = 0; }
    cur.nextDay = nextDay;
    s[key] = cur;
    this.setSchedule(type, s);
  },
  getWrongBook(){ return LS.get('wrong-book', []); },
  addWrong(type, key, q, ua, fb){
    const list = this.getWrongBook();
    const ex = list.find(x => x.type===type && x.key===key);
    if (ex){ ex.count = (ex.count||1)+1; ex.last = Date.now(); ex.userAnswer=ua; ex.feedback=fb; }
    else { list.unshift({ type, key, q, userAnswer:ua, feedback:fb, count:1, last:Date.now() }); }
    LS.set('wrong-book', list.slice(0,200));

const VALVE_TERMS = ['WCB','CF8','CF8M','WC6','WC9','LCB','LC3','2205','双相钢','不锈钢','碳钢','API','ASME','GB','ISO','NACE','PN','Class','PTFE','PPL','STL','石墨','螺栓','螺母','填料','垫片','阀杆','阀体','阀座','密封','内漏','外漏','卡涩','冲蚀','腐蚀','淬火','回火','正火','退火','调质','固溶','渗氮','深冷','防火','防静电','扭矩','压力','温度','介质'];
function extractKeywords(text){
  if (!text) return [];
  const found = new Set();
  const lower = text.toLowerCase();
  VALVE_TERMS.forEach(t => { if (lower.includes(t.toLowerCase())) found.add(t); });
  return [...found];
}
function localJudge(answer, reference){
  const a = (answer||'').trim();
  const ref = (reference||'').trim();
  if (!a) return { correct:false, score:0, feedback:'没有作答' };
  const al = a.toLowerCase(), rl = ref.toLowerCase();
  const parts = ref.split(/[；;，,、\/\n]+/).map(x => x.trim()).filter(Boolean);
  for (const p of parts){
    const pl = p.toLowerCase();
    if (p.length>=2 && (al.includes(pl) || pl.includes(al))) return { correct:true, score:92, feedback:'命中：'+p };
  }
  if (al.length>=2 && (rl.includes(al) || al.includes(rl))) return { correct:true, score:88, feedback:'意思对了' };
  const keys = extractKeywords(reference);
  if (keys.length){
    const hit = keys.filter(k => al.includes(k.toLowerCase()));
    const score = Math.round(hit.length/keys.length*100);
    if (score >= 40) return { correct:true, score, feedback:'命中关键点：'+hit.join('、') };
    return { correct:false, score, feedback:'缺少关键点：'+keys.slice(0,4).join('、') };
  }
  const refChars = [...new Set(ref.replace(/[^\u4e00-\u9fa5]/g,''))];
  const aChars = [...new Set(a.replace(/[^\u4e00-\u9fa5]/g,''))];
  if (!refChars.length || !aChars.length) return { correct:false, score:0, feedback:'无法自动判定' };
  const overlap = aChars.filter(c => refChars.includes(c)).length;
  const ratio = overlap / Math.max(aChars.length, 1);
  return { correct: ratio >= 0.5, score: Math.round(ratio*100), feedback: ratio >= 0.5 ? '大意接近' : '和参考答案差距较大' };
}

/* ========== 翻译（MyMemory，免费） ========== */
const TranslateService = {
  cache: LS.get('translate-cache', {}),
  save(){
    const keys = Object.keys(this.cache);
    if (keys.length > 500){
      keys.slice(0, keys.length - 500).forEach(k => delete this.cache[k]);
    }
    LS.set('translate-cache', this.cache);
  },
  async translate(text, from='en', to='zh'){
    if (!text) return '';
    const t = text.trim().slice(0, 480);
    const key = from+':'+to+':'+t;
    if (this.cache[key]) return this.cache[key];
    try {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${from}|${to}`;
      const d = await apiGet(url, 7000);
      const result = (d.responseData && d.responseData.translatedText) || '';
      if (result && result !== t){
        this.cache[key] = result;
        this.save();
        return result;
      }
    } catch(e){ console.warn('翻译失败：', e); }
    return '';
  }
};

const ExampleStore = {
  cache: LS.get('example-cache-v3', {}),
  save(){
    const keys = Object.keys(this.cache);
    if (keys.length > 1000){
      keys.slice(0, keys.length - 1000).forEach(k => delete this.cache[k]);
    }
    LS.set('example-cache-v3', this.cache);
  },
  has(word){ const c = this.cache[word]; return !!(c && c.en); },
  get(word){ const c = this.cache[word]; return c && c.en ? c : null; },
  set(word, ex){ this.cache[word] = { ...ex, t: Date.now() }; this.save(); },
  async fetchFor(word){
    if (this.has(word)) return this.get(word);
    if (!word) return null;
    try {
      const url = `https://api.tatoeba.org/v1/sentences?lang=eng&q=${encodeURIComponent(word)}&limit=5&sort=relevance`;
      const d = await apiGet(url, 7000);
      const list = d.data || [];
      if (!list.length){ this.set(word, { en:null }); return null; }
      const pick = list.find(x => {
        const t = (x.text||'').trim();
        return t.length > 20 && t.length < 110 && !/["\[\]<>{}]/.test(t);
      }) || list.find(x => (x.text||'').length > 10) || list[0];
      const en = (pick.text||'').trim();
      if (!en) return null;
      const result = { en };
      this.set(word, result);
      TranslateService.translate(en, 'en', 'zh').then(cn => {
        if (cn){
          const c = this.cache[word];
          if (c){ c.cn = cn; this.save(); }
          if (state.tab==='study' && (state.studySub==='english' || state.studySub==='today')) render();
        }
      });
      return result;
    } catch(e){
      console.warn('例句获取失败：', word, e);
      return null;
    }
  },
  preload(words){
    (words || []).forEach(w => {
      if (!w || !w.w || w.scene) return;
      if (this.has(w.w)) return;
      if (!this._loading) this._loading = {};
      if (this._loading[w.w]) return;
      this._loading[w.w] = true;
      this.fetchFor(w.w).then(() => {
        this._loading[w.w] = false;
        if (state.tab==='study' && (state.studySub==='english' || state.studySub==='today')) render();
      });
    });
  }
};

  const fullText = await httpGet(txtUrl, 7000);

  if (start > 0) start = fullText.indexOf('\n', start)+1; else start = 0;
  const preview = fullText.slice(start, start+600).trim();
  const story = { title: book.title, author: (book.authors||[]).map(a=>a.name).join(', '), preview: preview.slice(0,500), url: txtUrl };
  TranslateService.translate(story.preview, 'en', 'zh').then(cn => {
    if (cn){
      story.cn = cn;
      if (state.tab==='study' && state.studySub==='express') render();
    }
  });
  return story;
}

/* ★★★ 语音：用 new Audio() 每次创建，同步调用 play() ★★★ */
let _currentAudio = null;
let _currentBtn = null;
let _playToken = 0;

function _cleanupTTS(){
  if (_currentBtn){
    _currentBtn.classList.remove('playing');
    if (_currentBtn.dataset.idle) _currentBtn.textContent = _currentBtn.dataset.idle;
    _currentBtn = null;
  }
}

function stopSpeak(){
  _playToken++;
  try{ if (window.AndroidBridge && window.AndroidBridge.stopSpeak) window.AndroidBridge.stopSpeak(); }catch(e){}
  try{ if ('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
  try{ if (_currentAudio){ _currentAudio.pause(); _currentAudio.currentTime = 0; } }catch(e){}
  _currentAudio = null;
  _cleanupTTS();
}

function playOnlineTTS(text, lang, btn){
  if (!text) return false;
  try {
    // 清理上一个
    if (_currentAudio){
      try{ _currentAudio.pause(); }catch(e){}
      _currentAudio = null;
    }
    _cleanupTTS();

    const token = ++_playToken;
    const shortText = text.length > 200 ? text.slice(0, 200) : text;
    const isZh = lang && lang.startsWith('zh');
    const type = (lang === 'en-GB') ? 1 : 2;
    const url = isZh
      ? `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(shortText)}&le=zh`
      : `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(shortText)}&type=${type}`;

    // 关键：每次 new Audio()，避免状态污染
    const audio = new Audio();
    audio.src = url;
    audio.volume = 1;
    _currentAudio = audio;
    _currentBtn = btn || null;

    if (btn){
      btn.classList.add('playing');
      if (btn.dataset.busy) btn.textContent = btn.dataset.busy;
    }

    const cleanup = () => {
      if (token !== _playToken) return;
      if (btn){
        btn.classList.remove('playing');
        if (btn.dataset.idle) btn.textContent = btn.dataset.idle;
      }
      if (_currentAudio === audio) _currentAudio = null;
      if (_currentBtn === btn) _currentBtn = null;
    };

    audio.onended = cleanup;
    audio.onerror = () => { console.warn('audio error'); cleanup(); };

    // 关键：同步调用 play()（在用户点击的同步上下文里）
    const playPromise = audio.play();
    if (playPromise && playPromise.catch){
      playPromise.catch(err => {
        console.warn('play() rejected:', err);
        // 重试一次：等加载完成再播
        setTimeout(() => {
          if (token !== _playToken) return;
          audio.load();
          const retry = audio.play();
          if (retry && retry.catch){
            retry.catch(err2 => {
              console.warn('retry failed:', err2);
              cleanup();
              toast('播放失败，请再点一次');
            });
          }
        }, 100);
      });
    }
    return true;
  } catch(e){
    console.warn('TTS error:', e);
    _cleanupTTS();
    return false;
  }
}

function toggleSpeak(text, lang, btn){
  if (!text) return;
  const wasPlaying = btn && btn.classList.contains('playing');
  stopSpeak();
  if (wasPlaying) return;

  // 优先 Android 原生桥
  if (window.AndroidBridge && typeof window.AndroidBridge.speak === 'function'){
    try{
      let ok = true;
      if (typeof window.AndroidBridge.isReady === 'function') ok = window.AndroidBridge.isReady();
      if (ok){
        const spoken = window.AndroidBridge.speak(text, lang || 'en-US');
        if (spoken){
          if (btn){ btn.classList.add('playing'); if (btn.dataset.busy) btn.textContent = btn.dataset.busy; }
          const dur = Math.max(1500, text.length * (lang && lang.startsWith('zh') ? 220 : 320));
          setTimeout(() => { if (btn){ btn.classList.remove('playing'); if (btn.dataset.idle) btn.textContent = btn.dataset.idle; } }, dur);
          return;
        }
      }
    }catch(e){ console.warn('Android TTS 失败：', e); }
  }

  // 在线 TTS
  playOnlineTTS(text, lang, btn);
}

function copyText(text){
  return new Promise(resolve => {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => resolve(true)).catch(() => resolve(false));
      return;
    }
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      resolve(ok);
    }catch(e){ resolve(false); }
  });
}
function openExternal(url){
  try{
    const a = document.createElement('a');
    a.href = url; a.target='_blank'; a.rel='noopener noreferrer';
    a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(() => a.remove(), 150);
  }catch(err){ toast('打开失败'); }
}

    <div class="progress-bar"><div style="width:${pct}%;"></div></div>
  </div>
  <div class="subtabs" style="margin-bottom:12px;">
    <button class="subtab ${sub==='today'?'on':''}" data-act="englishSub" data-sub="today">今日待学</button>
    <button class="subtab ${sub==='all'?'on':''}" data-act="englishSub" data-sub="all">全部</button>
    <button class="subtab ${sub==='learned'?'on':''}" data-act="englishSub" data-sub="learned">已学</button>
  </div>`;
  if (sub === 'today') return head + englishTodayBlock(curDeck, deckWords, learnedToday);
  if (sub === 'all') return head + englishAllBlock(deckWords, learnedAll);
  if (sub === 'learned') return head + englishLearnedBlock(deckWords, learnedAll);
  return head;
}

function englishTodayBlock(deckId, deckWords, learnedToday){
  const todayNames = Store.getTodayWordNames(deckId);
  const todayWords = todayNames.map(w => deckWords.find(x => x.w === w)).filter(Boolean);
  const doneCount = todayWords.filter(w => learnedToday.has(w.w)).length;
  const allDone = todayWords.length > 0 && doneCount === todayWords.length;
  ExampleStore.preload(todayWords.filter(w => !learnedToday.has(w.w)));
  return `
  <div class="sec-title">今日待学 <span class="muted">${doneCount}/${todayWords.length} 已完成</span></div>
  ${allDone?'<div style="margin-bottom:12px;padding:10px 14px;background:#ecfdf5;border-radius:12px;font-size:12.5px;color:#047857;font-weight:650;text-align:center;">🎉 今天的 5 个单词都学完了！明天会换新的</div>':''}
  ${todayWords.length ? todayWords.map((w,i) => wordCard(w, i, learnedToday.has(w.w), true)).join('') : '<div class="tip-card">这个词库已全部学完。</div>'}
  <div class="tip-card">💡 点左侧圆圈标记已掌握。例句自动从 Tatoeba 抓取并翻译。</div>`;
}

function englishAllBlock(deckWords, learnedAll){
  const pageSize = state.englishPage * PAGE_SIZE;
  const visible = deckWords.slice(0, pageSize);
  const hasMore = deckWords.length > pageSize;
  ExampleStore.preload(visible.slice(0, 15));
  return `

function englishLearnedBlock(deckWords, learnedAll){
  const list = deckWords.filter(w => learnedAll.has(w.w));
  if (!list.length) return `<div class="tip-card">还没有学过任何单词。</div>`;
  const pageSize = state.englishPage * PAGE_SIZE;
  const visible = list.slice(0, pageSize);
  const hasMore = list.length > pageSize;
  return `
  <div class="sec-title">已学单词 <span class="muted">${list.length} 个</span></div>
  ${visible.map((w, i) => wordCard(w, i, true)).join('')}

}

function renderGradeCard(g){
  if (!g) return '';
  if (g.error) return `<div class="score-card" style="background:#fef3c7;"><div style="font-size:13px;color:#92400e;">⚠️ ${esc(g.error)}</div></div>`;
  const score = g.score || 0;
  const level = g.level || (score>=85?'优秀':score>=70?'良好':score>=55?'合格':'待提升');
  return `<div class="score-card">
    <div class="score-head">
      <div class="score-num">${score}<span style="font-size:14px;opacity:.55;font-weight:600;">/100</span></div>
      <div class="score-label">${esc(level)} · AI 评分</div>
    </div>
    ${g.strengths&&g.strengths.length?`<div class="score-row"><div class="score-row-title" style="color:var(--ok)">✅ 优点</div><ul class="score-list">${g.strengths.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>`:''}
    ${g.issues&&g.issues.length?`<div class="score-row"><div class="score-row-title" style="color:var(--warn)">⚠️ 改进</div><ul class="score-list">${g.issues.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>`:''}
    ${g.improved?`<div class="score-row"><div class="score-row-title">✍️ 修改后</div><div class="score-extra">${esc(g.improved)}</div></div>`:''}
    ${g.advice?`<div class="score-row"><div class="score-row-title">💡 建议</div><div style="font-size:13px;color:#065f46;font-style:italic;">"${esc(g.advice)}"</div></div>`:''}
  </div>`;
}

let renderToken = 0;
async function render(){
  const token = ++renderToken;
  const tab = state.tab;
  document.querySelectorAll('[data-scroll-id]').forEach(el => { chipsScrollMemory[el.dataset.scrollId] = el.scrollLeft; });
  renderTabs();
  updateTopbar();
  view.scrollTop = 0;
  view.innerHTML = SKELETON[tab] || '<div class="sk" style="height:200px"></div>';
  let html;
  try{ html = await VIEWS[tab](); }catch(e){ console.error(e); html = `<div class="tip-card">加载失败：${esc(e.message)}</div>`; }
  if (token !== renderToken || state.tab !== tab) return;
  view.innerHTML = html;
  requestAnimationFrame(() => {
    document.querySelectorAll('[data-scroll-id]').forEach(el => {
      const saved = chipsScrollMemory[el.dataset.scrollId];
      if (saved !== undefined) el.scrollLeft = saved;
    });
  });
}

function sheetHTML(html){ return `<div class="sheet-mask" data-act="closeSheet"></div><div class="sheet-body">${html}</div>`; }
function openSheet(html){ sheet.classList.remove('open'); sheet.innerHTML = sheetHTML(html); requestAnimationFrame(() => sheet.classList.add('open')); }
function updateSheet(html){ const b = sheet.querySelector('.sheet-body'); if (b && sheet.classList.contains('open')) b.innerHTML = html; else openSheet(html); }
function closeSheet(){ sheet.classList.remove('open'); state.review = null; setTimeout(() => { if (!sheet.classList.contains('open')) sheet.innerHTML = ''; }, 320); }

function startReview(type, list){

function renderReviewSheet(){
  const r = state.review;
  if (!r) return;
  if (r.index >= r.list.length){
    const correct = r.history.filter(h => h.correct).length;
    const score = Math.round(correct / r.list.length * 100);
    if (r.type === 'weekly'){
      Store.saveWeeklyResult({ score, total: r.list.length, correct, records: r.history, takenAt: Date.now() });
    }
    updateSheet(`
      <div class="sheet-head"><div class="sheet-emoji">🎉</div><div><h2>完成</h2><div class="muted">共 ${r.list.length} 题 · 答对 ${correct} 题 · 得分 ${score}</div></div></div>
      <button class="btn primary wide" style="margin-top:20px" data-act="closeSheet">完成</button>
    `);
    return;
  }
  const item = r.list[r.index];
  const isEn = (r.type === 'english') || item.type === 'english';
  const q = isEn ? (item.w || item.q) : (item.q || item.w);
  const ref = isEn ? item.cn : (item.a + '\n\n要点：' + (item.key||''));
  const body = `
    <div class="sheet-head">
      <div class="sheet-emoji">${isEn?'🔤':'⚙️'}</div>
      <div style="flex:1;min-width:0;">
        <h2 style="font-size:16px;">${r.type==='weekly'?'周测':(isEn?'英语单词':'阀门知识')}复习</h2>
        <div class="muted">第 ${r.index+1} / ${r.list.length} 题</div>
      </div>
    </div>
    <div style="background:#f8f9fd;border-radius:14px;padding:16px;margin:14px 0;">
      ${isEn?`<div style="font-size:28px;font-weight:850;color:#2b3244;margin-bottom:8px;">${esc(q)}</div>
        <button class="btn ghost" data-act="reviewSpeak" data-text="${esc(q)}" data-lang="en-US">🔊 再听一遍</button>`:
        `<div style="font-size:15.5px;font-weight:750;line-height:1.5;color:#2b3244;">${esc(q)}</div>`}
    </div>
    <div style="font-size:13px;font-weight:700;color:#3b4256;margin-bottom:8px;">${isEn?'中文翻译':'你的答案'}</div>
    <textarea class="answer-input" id="reviewAnswer" placeholder="${isEn?'写出中文意思…':'写下你的答案…'}" ${r.judged?'readonly':''}>${esc(r.answer||'')}</textarea>
    ${r.judged && r.result?`
      <div class="score-card" style="${r.result.correct?'':'background:#fff7ed;border-color:#fdba74;'}">
        <div class="score-head">
          <div class="score-num" style="${r.result.correct?'':'color:#c2410c;'}">${r.result.accuracy||r.result.score||0}<span style="font-size:14px;opacity:.55;">%</span></div>
          <div class="score-label" style="${r.result.correct?'':'color:#c2410c;'}">${r.result.correct?'✓ 正确':'✗ 再想想'}</div>
        </div>
        ${r.result.supplement?`<div class="score-row"><div class="score-row-title">🔧 补充</div><div class="score-extra">${esc(r.result.supplement)}</div></div>`:''}
        ${r.result.feedback?`<div class="score-row"><div class="score-row-title">点评</div><div class="score-extra">${esc(r.result.feedback)}</div></div>`:''}
        ${!r.result.correct?`<div class="score-row"><div class="score-row-title">参考答案</div><div class="score-extra">${esc(ref)}</div></div>`:''}
      </div>
    `:''}
    <div style="margin-top:16px;">
      ${r.loading?`<button class="btn primary wide" disabled>⏳ 判定中…</button>`:
        r.judged?`
          <div style="font-size:13px;font-weight:700;color:#3b4256;margin-bottom:10px;text-align:center;">掌握得怎么样？</div>
          <div class="rate-row">
            <button class="rate-btn again" data-act="rate" data-rating="again">完全不会</button>
            <button class="rate-btn hard" data-act="rate" data-rating="hard">模糊</button>
            <button class="rate-btn good" data-act="rate" data-rating="good">熟练</button>
          </div>
        `:`<button class="btn primary wide" data-act="reviewSubmit">提交答案</button>`}
    </div>`;
  updateSheet(body);
  if (isEn && !r.judged && !r.answer){
    setTimeout(() => {
      if (state.review && state.review.index === r.index && !state.review.judged) toggleSpeak(q, 'en-US');
    }, 350);
  }
}
async function submitReviewAnswer(){
  const r = state.review;
  if (!r || r.loading) return;
  const ta = document.getElementById('reviewAnswer');
  const answer = (ta && ta.value || '').trim();
  if (!answer){ toast('先写下你的答案'); return; }
  r.answer = answer;
  const item = r.list[r.index];
  const isEn = (r.type === 'english') || item.type === 'english';
  const q = isEn ? (item.w || item.q) : (item.q || item.w);
  const ref = isEn ? item.cn : (item.a + '\n\n要点：' + (item.key||''));
  r.loading = true;
  renderReviewSheet();
  let result = null;
  if (AI.enabled()){
    try{
      if (isEn){
        const jr = await AI.judgeWord(q, answer, ref);
        if (jr) result = { correct:!!jr.correct, accuracy:jr.score||(jr.correct?90:30), score:jr.score, feedback:jr.feedback };
      } else {
        const sr = await AI.scoreAnswer(q, answer, ref);
        if (sr) result = { correct:(sr.accuracy||0)>=60, accuracy:sr.accuracy||0, supplement:sr.supplement||'', keywords:sr.keywords||[] };
      }
    }catch(e){ console.warn('AI 失败：', e); }
  }
  if (!result){
    const lj = localJudge(answer, ref);
    result = { correct:lj.correct, accuracy:lj.score, score:lj.score, feedback:lj.feedback };
  }
  r.loading = false; r.judged = true; r.result = result;
  r.history.push({ q, correct:!!result.correct, feedback: result.feedback||(result.correct?'答对了':'再看一遍参考答案'), userAnswer: answer, reference: ref });
  if (!result.correct) Store.addWrong(isEn?'english':'work', item.w||item.q, q, answer, result.feedback||'');
  renderReviewSheet();
  toast(result.correct?'✓ 答对了':'✗ 已加入错题本');
}
function rateAndNext(rating){
  const r = state.review;
  if (!r) return;
  const item = r.list[r.index];
  const isEn = (r.type === 'english') || item.type === 'english';
  const key = item.w || item.q;
  Store.rateItem(isEn?'english':'work', key, rating);
  if (rating !== 'again') Store.removeWrong(isEn?'english':'work', key);
  r.index += 1; r.answer = ''; r.result = null; r.judged = false;
  renderReviewSheet();
}
function startWeeklyTest(){
  const words = Store.getWeekLearnedWords();
  const knowledges = Store.getWeekLearnedKnowledge();
  const pool = [];
  words.forEach(w => {
    const item = DeckLoader.findWord(w);
    if (item) pool.push({ type:'english', w: item.w, cn: item.cn, item });
  });
  knowledges.forEach(k => {
    const item = SEED.VALVE_ALL.find(v => v.q === k);
    if (item) pool.push({ type:'work', q: item.q, a: item.a, key: item.key, item });
  });
  if (!pool.length){ toast('还没有学过的内容'); return; }
  const selected = shuffle(pool).slice(0, Math.min(10, pool.length));
  state.review = { type:'weekly', list: selected, index:0, answer:'', result:null, judged:false, loading:false, history:[] };
  renderReviewSheet();
}

view.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;

  if (act === 'speak'){ e.stopPropagation(); toggleSpeak(t.dataset.text, t.dataset.lang||'en-US', t); return; }
  if (act === 'speakYiyan'){ toggleSpeak(t.dataset.text, 'zh-CN', t); return; }
  if (act === 'speakQuote'){ toggleSpeak(t.dataset.text, 'en-US', t); return; }
  if (act === 'speakStory'){ toggleSpeak(t.dataset.text, 'en-US', t); return; }
  if (act === 'speakJoke'){ toggleSpeak(t.dataset.text, 'zh-CN', t); return; }
  if (act === 'speakGeneral'){ toggleSpeak(t.dataset.text, 'zh-CN', t); return; }
  if (act === 'copyText'){ copyText(t.dataset.text).then(ok => toast(ok?'已复制':'复制失败')); return; }

  if (act === 'studySub'){ state.studySub = t.dataset.sub; render(); return; }
  if (act === 'englishSub'){ state.englishSub = t.dataset.sub; state.englishPage = 1; render(); return; }
  if (act === 'englishDeck'){ state.englishDeck = t.dataset.deck; LS.set('english-deck', state.englishDeck); state.englishPage = 1; render(); return; }
  if (act === 'englishLoadMore'){ state.englishPage += 1; render(); return; }
  if (act === 'valveLoadMore'){ state.valvePage += 1; render(); return; }
  if (act === 'workSub'){ state.workSub = t.dataset.sub; render(); return; }
  if (act === 'discoverSub'){ state.discoverSub = t.dataset.sub; render(); return; }

  if (act === 'taskJump'){
    const key = t.dataset.key;
    if (key === 'words'){ state.studySub = 'english'; state.englishSub = 'today'; }
    else if (key === 'valve') state.studySub = 'valve';
    else if (key === 'passage' || key === 'expr') state.studySub = 'express';
    else if (key === 'logic') state.studySub = 'logic';
    else if (key === 'general') state.studySub = 'general';
    else if (key === 'yiyan' || key === 'quote' || key === 'story' || key === 'joke') state.studySub = 'express';
    else if (key === 'news'){ state.tab = 'discover'; state.discoverSub = 'news'; }
    render(); return;
  }

  if (act === 'learnWord'){
    const card = t.closest('[data-word]');
    const w = card.dataset.word;
    const deck = card.dataset.deck;
    const learned = Store.getLearned();
    const i = learned.indexOf(w);
    if (i < 0){ learned.push(w); Store.ensureSchedule('english', w); if (deck) Store.setWordDeck(w, deck); }
    else learned.splice(i, 1);
    Store.setLearned(learned);
    render();
    toast(i < 0 ? '已标记为已学' : '已取消');
    return;
  }

  if (act === 'loadExample'){
    e.stopPropagation();
    const word = t.dataset.word;
    const wrap = t.closest('[data-ex-wrap]');
    if (!wrap) return;
    t.disabled = true;
    t.textContent = '⏳ 获取中…';
    const ex = await ExampleStore.fetchFor(word);
    if (ex && ex.en){
      wrap.innerHTML = `
        <div style="font-size:11px;font-weight:700;color:var(--brand);margin-bottom:6px;">📝 例句</div>
        <div style="display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:#2b3244;line-height:1.6;">
          <span style="flex:1">${esc(ex.en)}</span>
          <button style="border:0;background:#f3f4fa;width:26px;height:26px;border-radius:9px;font-size:12px;cursor:pointer;flex-shrink:0;" data-act="speak" data-text="${esc(ex.en)}" data-lang="en-US">🔊</button>
        </div>
        ${ex.cn?`<div class="ex-cn">${esc(ex.cn)}</div>`:'<div class="ex-cn" style="opacity:.5;">翻译中…</div>'}`;
    } else {
      wrap.innerHTML = `
        <div style="font-size:11px;font-weight:700;color:var(--brand);margin-bottom:6px;">📝 例句</div>
        <div style="font-size:12px;color:var(--sub);">暂时没找到例句</div>
        <button class="ex-btn" style="margin-top:8px;" data-act="loadExample" data-word="${esc(word)}">🔄 重试</button>`;
    }
    return;
  }

  if (act === 'knowToggle'){
    const card = t.closest('.know');
    const q = card ? card.dataset.q : null;
    if (!q) return;
    state.openKnow = state.openKnow === q ? null : q;
    render(); return;
  }
  if (act === 'knowDone'){
    e.stopPropagation();
    const card = t.closest('.know');
    const q = card ? card.dataset.q : null;
    if (!q) return;
    const done = Store.getKnowDone();
    const i = done.indexOf(q);
    if (i < 0){ done.push(q); Store.ensureSchedule('work', q); }
    else done.splice(i, 1);
    Store.setKnowDone(done);
    toast(i < 0 ? '已标记掌握' : '已取消');
    render(); return;
  }
  if (act === 'thinkToggle'){
    const card = t.closest('.know');
    const name = card ? card.dataset.think : null;
    if (!name) return;
    state.openThink = state.openThink === name ? null : name;
    if (state.openThink !== name) state.thinkHint = null;
    render(); return;
  }
  if (act === 'thinkHint'){ e.stopPropagation(); const name = t.dataset.name; state.thinkHint = state.thinkHint === name ? null : name; render(); return; }
  if (act === 'thinkDone'){ e.stopPropagation(); Store.markThinkDone(t.dataset.name); toast('已记录'); render(); return; }

  if (act === 'valveCat'){ state.valveCat = t.dataset.cat; state.searchQuery = ''; state.openKnow = null; state.valvePage = 1; render(); return; }
  if (act === 'searchClear'){ state.searchQuery = ''; render(); return; }
  if (act === 'markPassageDone'){ Store.markTodayDone('passage'); render(); toast('已记录'); return; }
  if (act === 'removeStudyPlan'){ Store.removeStudyPlan(+t.dataset.idx); render(); return; }
  if (act === 'linkToStudy'){
    const idx = +t.dataset.idx;
    const records = LS.get('work-records', []);
    const rec = records[idx];
    if (rec){ Store.linkWorkToStudy(rec); toast('已加入学习计划'); render(); }
    return;
  }

  if (act === 'markGeneralDone'){ LS.set('general-done:'+DAY, true); toast('已记录'); render(); return; }
  if (act === 'refreshGeneral'){ state.generalData = null; state.generalLoading = false; render(); return; }
  if (act === 'markYiyanDone'){ LS.set('yiyan-done:'+DAY, true); toast('已记录'); render(); return; }
  if (act === 'markQuoteDone'){ LS.set('quote-done:'+DAY, true); toast('已记录'); render(); return; }
  if (act === 'markStoryDone'){ LS.set('story-done:'+DAY, true); toast('已记录'); render(); return; }
  if (act === 'markJokeDone'){ LS.set('joke-done:'+DAY, true); toast('已记录'); render(); return; }

  if (act === 'openStory'){ openExternal(t.dataset.url); return; }
  if (act === 'refreshJoke'){ state.jokeData = null; state.jokeLoading = false; render(); return; }

  if (act === 'askAbout'){
    e.stopPropagation();
    const q = t.dataset.q;
    const card = t.closest('.know') || t.closest('.card');
    if (!card){ toast('找不到卡片'); return; }
    const input = card.querySelector('[data-qa-q]');
    const question = (input && input.value || '').trim();
    if (!question){ toast('先输入问题'); return; }
    if (!AI.enabled()){ toast('请先在「我的」页配置 AI'); return; }
    LS.set('ask-text:'+q, question);
    state.aiAnsweringFor = q; state.aiLoading = true;
    render();
    try{
      const item = SEED.VALVE_ALL.find(v => v.q === q);
      const context = item ? `${item.cat}：${item.a} ${item.key}` : '';
      const answer = await AI.answerQuestion(question, context);
      LS.set('ask-cache:'+q, { question, answer: answer||'（无返回）', t: Date.now() });
      toast('AI 已解答');
    }catch(err){
      LS.set('ask-cache:'+q, { question, answer: '调用失败：'+(err.message||'未知错误'), t: Date.now() });
      toast('调用失败');
    }
    state.aiLoading = false; state.aiAnsweringFor = null;
    render(); return;
  }
  if (act === 'saveAskToNote'){
    e.stopPropagation();
    const q = t.dataset.q;
    const cache = LS.get('ask-cache:'+q, null);
    if (!cache) return;
    const cur = Store.getNote(q);
    const text = '【提问】'+cache.question+'\n\n【AI 解答】\n'+cache.answer;
    Store.setNote(q, cur ? (cur+'\n\n'+text) : text);
    toast('已记入笔记'); render(); return;
  }
  if (act === 'clearAsk'){ LS.del('ask-cache:'+t.dataset.q); render(); return; }

  if (act === 'startReview'){
    e.stopPropagation();
    const type = t.dataset.type;
    if (type === 'english'){
      toast('加载中…');
      try { await DeckLoader.ensureForReview(); }catch(err){ console.warn(err); }
      const keys = Store.getReviewList('english', REVIEW_TARGET);
      const list = keys.map(k => DeckLoader.findWord(k)).filter(Boolean);
      if (!list.length){ toast('还没有学过的单词'); return; }
      startReview(type, list);
    } else {
      const keys = Store.getReviewList('work', REVIEW_TARGET);
      const list = keys.map(k => SEED.VALVE_ALL.find(v => v.q === k)).filter(Boolean);
      if (!list.length){ toast('还没有学过的知识'); return; }
      startReview(type, list);
    }
    return;
  }
  if (act === 'startWeeklyTest'){ startWeeklyTest(); return; }
  if (act === 'restartWeekly'){ Store.clearWeeklyResult(); render(); return; }
  if (act === 'reviewWrong'){
    const list = Store.getWrongBook().filter(x => x.type === 'work').map(x => SEED.VALVE_ALL.find(v => v.q === x.key)).filter(Boolean);
    if (!list.length){ toast('错题本是空的'); return; }
    startReview('work', list);
    return;
  }

  if (act === 'gradeAnswer'){
    e.stopPropagation();
    const scene = t.dataset.scene, q = t.dataset.q, guide = t.dataset.guide;
    const ta = document.getElementById('exprAnswer');
    const answer = (ta && ta.value || '').trim();
    if (!answer){ toast('先写下你的回答'); return; }
    if (answer.length < 20){ toast('至少写两句'); return; }
    if (!AI.enabled()){ toast('请先在「我的」页配置 AI'); return; }
    const key = 'expr-'+scene+'-'+q;
    LS.set('expr-ans:'+key, answer);
    t.disabled = true; t.textContent = '⏳ 评分中…';
    const resultEl = document.getElementById('gradeResult');
    if (resultEl) resultEl.innerHTML = `<div style="margin-top:12px;padding:14px;background:#f8f9fd;border-radius:12px;font-size:13px;color:var(--sub);text-align:center;">AI 评分中…</div>`;
    try{
      const result = await AI.gradeExpression(scene, q, guide, answer);
      if (result){ LS.set('expr-grade:'+key, result); if (resultEl) resultEl.innerHTML = renderGradeCard(result); toast('评分完成'); }
      else { if (resultEl) resultEl.innerHTML = renderGradeCard({ error:'AI 无返回' }); }
    }catch(err){
      if (resultEl) resultEl.innerHTML = renderGradeCard({ error:'调用失败：'+(err.message||'未知错误') });
    }finally{ t.disabled = false; t.textContent = '🔄 重新评分'; }
    return;
  }
  if (act === 'clearExprAnswer'){
    if (!confirm('清空？')) return;
    const key = 'expr-'+t.dataset.scene+'-'+t.dataset.q;
    LS.del('expr-ans:'+key); LS.del('expr-grade:'+key);
    toast('已清空'); render(); return;
  }

  if (act === 'recCat'){ state.recommendCat = t.dataset.cat; state.recData = null; render(); return; }

  if (act === 'openApp'){
    e.stopPropagation();
    const scheme = t.dataset.scheme;
    const name = t.dataset.name;
    const item = (state.recData && state.recData.item) || {};
    if (!scheme){ toast('没有配置'); return; }
    const schemeName = scheme.replace(/:\/\/.*$/, '');
    copyText(name);
    if (window.AndroidBridge && typeof window.AndroidBridge.openUrl === 'function'){
      try{
        const pkg = item.packageName || '';
        if (pkg){
          const intentUrl = `intent://#Intent;scheme=${schemeName};package=${pkg};end`;
          if (window.AndroidBridge.openUrl(intentUrl)){ toast('正在打开…'); return; }
        }
        if (window.AndroidBridge.openUrl(scheme)){ toast('正在打开…'); return; }
      }catch(err){}
    }
    try{
      const a = document.createElement('a');
      a.href = scheme; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(() => a.remove(), 200);
    }catch(err){}
    return;
  }
  if (act === 'openWeb'){
    e.stopPropagation();
    const item = (state.recData && state.recData.item) || null;
    if (item && item.web) openExternal(item.web(item.name));
    return;
  }

  if (act === 'saveGrowth'){
    const growth = Store.getGrowth() || {};
    const refl = document.getElementById('growthReflection');
    growth.reflection = refl ? refl.value : '';
    Store.setGrowth(growth);
    Store.pushGrowthLog({ date: todayStr(), reflection: growth.reflection, t: Date.now() });
    toast('已保存'); return;
  }
  if (act === 'saveWorkRecord'){
    const p = document.getElementById('workProblem');
    const s = document.getElementById('workSolution');
    const k = document.getElementById('workKeywords');
    const rec = { date: todayStr(), problem: p ? p.value.trim() : '', solution: s ? s.value.trim() : '', keywords: k ? k.value.trim() : '' };
    if (!rec.problem){ toast('先写下问题'); return; }
    LS.set('work-record-'+todayStr(), rec);
    const list = LS.get('work-records', []);
    const filtered = list.filter(x => x.date !== rec.date);
    filtered.unshift(rec);
    LS.set('work-records', filtered.slice(0, 200));
    toast('已保存'); render(); return;
  }

  if (act === 'quickAsk'){
    if (!AI.enabled()){ toast('请先配置 AI'); return; }
    Store.addAIHistory('user', t.dataset.prompt);
    state.aiLoading = true;
    openAIAssistant();
    try{
      const answer = await AI.assistant(t.dataset.prompt, state.aiRole);
      Store.addAIHistory('bot', answer || '（无返回）');
    }catch(e){ Store.addAIHistory('bot', '调用失败：'+(e.message||'未知错误')); }
    state.aiLoading = false;
    openAIAssistant();
    return;
  }

  if (act === 'aiSend'){ sendAIMessage(); return; }
  if (act === 'aiRole'){ state.aiRole = t.dataset.role; LS.set('ai-role', state.aiRole); openAIAssistant(); return; }
  if (act === 'clearAIHistory'){ if (confirm('清空？')){ Store.clearAIHistory(); openAIAssistant(); } return; }
  if (act === 'setAccent'){ LS.set('voice-accent', t.dataset.accent); render(); return; }

  if (act === 'diagTTS'){ playOnlineTTS('Hello, this is an online TTS test. 测试朗读。', 'en-US'); return; }

  if (act === 'exportData'){ doExport(); return; }
  if (act === 'importData'){ doImport(); return; }

  if (act === 'saveAI'){
    const provider = document.getElementById('aiProvider').value;
    const key = document.getElementById('aiKey').value.trim();
    if (provider !== 'none' && !key){ toast('请填入 API Key'); return; }
    AI.set(provider, key, '');
    toast(provider === 'none' ? '已关闭 AI' : '已保存');
    render(); return;
  }
  if (act === 'clearData'){
    if (confirm('确定清空所有数据？')){
      Store.clearAll();
      toast('已清空');
      setTimeout(() => location.reload(), 500);
    }
    return;
  }
});

sheet.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'closeSheet'){ closeSheet(); return; }
  if (act === 'reviewSpeak'){ toggleSpeak(t.dataset.text, t.dataset.lang||'en-US', t); return; }
  if (act === 'reviewSubmit'){ submitReviewAnswer(); return; }
  if (act === 'rate'){ rateAndNext(t.dataset.rating); return; }
  if (act === 'aiRole'){ state.aiRole = t.dataset.role; LS.set('ai-role', state.aiRole); openAIAssistant(); return; }
  if (act === 'clearAIHistory'){ if (confirm('清空？')){ Store.clearAIHistory(); openAIAssistant(); } return; }
  if (act === 'aiSend'){ sendAIMessage(); return; }
  if (act === 'copyExport'){
    const ta = document.getElementById('exportText');
    if (ta){ ta.select(); ta.setSelectionRange(0, ta.value.length); copyText(ta.value).then(ok => toast(ok?'已复制':'失败')); }
    return;
  }
  if (act === 'doImportConfirm'){
    const ta = document.getElementById('importText');
    const text = (ta && ta.value || '').trim();
    if (!text){ toast('请粘贴备份文本'); return; }
    try{
      Store.importDataFromText(text);
      toast('导入成功');
      closeSheet();
      setTimeout(() => location.reload(), 700);
    }catch(err){ toast('格式不对：'+err.message); }
    return;
  }
});

tabbar.addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  stopSpeak();
  state.tab = t.dataset.tab;
  render();
});
fab.addEventListener('click', () => openAIAssistant());
document.getElementById('globalSearchBtn').addEventListener('click', () => {
  openSheet(`
    <div class="sheet-head">
      <div class="sheet-emoji">🔍</div>
      <div style="flex:1;min-width:0;"><h2>全局搜索</h2></div>
    </div>
    <div class="global-search-bar" style="margin-top:14px;">
      <span style="font-size:15px;opacity:.5;">🔍</span>
      <input id="globalSearchInput" placeholder="输入关键词…" autofocus>
    </div>
    <div id="globalSearchResults" style="max-height:60vh;overflow-y:auto;"></div>
  `);
  setTimeout(() => {
    const input = document.getElementById('globalSearchInput');
    if (input){
      input.focus();
      input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        const el = document.getElementById('globalSearchResults');
        if (!q){ el.innerHTML = ''; return; }
        const results = [];
        SEED.VALVE_ALL.forEach(v => {
          if (v.q.toLowerCase().includes(q) || v.a.toLowerCase().includes(q)) results.push({ type:'valve', label:'知识', q:v.q, snip:v.a.slice(0,80) });
        });
        Object.keys(DeckLoader.loaded).forEach(id => {
          (DeckLoader.loaded[id]||[]).forEach(w => {
            if (w.w.toLowerCase().includes(q) || (w.cn||'').includes(input.value)) results.push({ type:'word', label:'单词', q:w.w, snip:(w.cn||'')+' · '+id });
          });
        });
        el.innerHTML = results.slice(0,50).map(r => `<div class="search-result">
          <span class="search-result-type type-${r.type}">${r.label}</span>
          <div class="search-result-q">${esc(r.q)}</div>
          <div class="search-result-snippet">${esc(r.snip)}</div>
        </div>`).join('') || `<div style="text-align:center;padding:20px;font-size:12.5px;color:var(--sub);">没有找到</div>`;
      });
    }
  }, 100);
});

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.querySelector('.phone').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 1900);
}

(function init(){
  loadDataFromGlobals();
  Store.checkIn();
  render();
})();
</script>
</body>
</html>
